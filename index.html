<html lang="nl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--paper:#101a14;--ink:#eef4ec;--stripe:#16231b;--line:#2a3d30;--muted:#9bb0a1;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 12% 25%,rgba(60,200,110,.4),transparent 42%),radial-gradient(circle at 88% 55%,rgba(255,214,10,.35),transparent 40%),radial-gradient(circle at 30% 90%,rgba(27,110,55,.3),transparent 45%),var(--paper) fixed;color:var(--ink);font:400 1rem/1.5 Archivo,system-ui,sans-serif}
:focus-visible{outline:3px solid var(--card);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.hero{position:relative;background:radial-gradient(ellipse at 50% 120%,#1f7a42 0,transparent 60%),linear-gradient(180deg,#04100a 0,#0b2e1a 55%,#145230 100%);color:#fff;overflow:hidden}

.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px}
.hero svg{position:absolute;inset:0;width:100%;height:100%;stroke:rgba(255,255,255,.22);fill:none;stroke-width:2}
.hero div{position:relative;max-width:960px;margin:0 auto;padding:72px 20px 140px}
h1{font:700 clamp(3rem,11vw,7rem)/.9 "Archivo Narrow","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 0 46px rgba(255,255,200,.4),0 4px 0 rgba(0,0,0,.28)}
.hero p{max-width:46ch;margin-top:16px;color:#d8ead9}
main{max-width:960px;margin:0 auto;padding:22px 20px 56px}
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:22px}
.tab{font:700 1rem "Archivo Narrow",sans-serif;background:none;border:0;position:relative;color:var(--muted);padding:8px 0 16px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--ink)}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:999px}
input{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:0;padding:8px 12px;width:min(100%,260px)}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font:700 .85rem "Archivo Narrow",sans-serif;color:var(--muted);text-align:right;border-bottom:0;padding:0 0 8px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0)) bottom/100% 6px no-repeat,linear-gradient(90deg,rgba(60,200,110,.95),rgba(27,100,50,1)) bottom/100% 6px no-repeat}

th button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:10px 10px;width:100%;text-align:inherit}
th button{position:relative}
th[aria-sort="ascending"] button,th[aria-sort="descending"] button{color:var(--ink)}
th[aria-sort="ascending"] button::after,th[aria-sort="descending"] button::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:8px;border-radius:999px}
td{padding:12px 10px;text-align:right;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1)),color-mix(in srgb,var(--tint,#fff) 45%,transparent);backdrop-filter:blur(12px) saturate(1.8);-webkit-backdrop-filter:blur(12px) saturate(1.8);border-top:1px solid rgba(255,255,255,.95);border-bottom:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(15,60,30,.1);transition:background .2s}
td:first-child{border-left:1px solid rgba(255,255,255,.95);border-radius:16px 0 0 16px}
td:last-child{border-right:1px solid rgba(255,255,255,.6);border-radius:0 16px 16px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) td{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),color-mix(in srgb,var(--tint,#fff) 38%,transparent);border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.35)}}
td:nth-child(2),td:nth-child(3){text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover td{filter:brightness(1.1) saturate(1.25)}
.pos{width:44px;font:700 1.3rem "Archivo Narrow",sans-serif;color:var(--muted)}
tr.first .pos{color:var(--ink)}
.nm{font:600 1.05rem Archivo,sans-serif;background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}
.yr{display:block;font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;background:var(--tint);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),0 0 0 1px rgba(0,0,0,.18)}
.g{font:700 1.5rem "Archivo Narrow",sans-serif}
.meter{position:relative;display:block;height:16px;min-width:110px;margin-top:6px;border-radius:999px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.12)),rgba(27,90,50,.14);backdrop-filter:blur(8px) saturate(1.8);-webkit-backdrop-filter:blur(8px) saturate(1.8);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 5px rgba(15,60,30,.14),0 1px 4px rgba(15,26,19,.2)}
.meter i{position:relative;display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 55%),linear-gradient(90deg,color-mix(in srgb,var(--tint,#2f7d46) 70%,#fff),var(--tint,#2f7d46));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -4px 6px rgba(0,0,0,.3),0 0 10px color-mix(in srgb,var(--tint,#2f7d46) 60%,transparent);transition:width .5s}
.meter i::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:4px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,.1))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .meter{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04)),rgba(120,220,160,.08);border-color:rgba(255,255,255,.28);box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -3px 5px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.5)}}
.hero::after,.tab[aria-pressed="true"]::after,th[aria-sort="ascending"] button::after,th[aria-sort="descending"] button::after,dialog::before{background:linear-gradient(180deg,rgba(255,255,255,.65) 0,rgba(255,255,255,0) 55%),linear-gradient(90deg,rgba(255,224,60,.92),rgba(255,190,0,.95));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -3px 5px rgba(140,90,0,.35),0 0 10px rgba(255,214,10,.5);border:1px solid rgba(255,255,255,.7);pointer-events:none}
.podium{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:14px;align-items:end;margin:-96px 0 30px}
.podium[hidden]{display:none}
.pc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:#fff;cursor:pointer;padding:20px 18px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 45%),color-mix(in srgb,var(--tint) 58%,#08150d);backdrop-filter:blur(14px) saturate(1.8);-webkit-backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -8px 16px rgba(0,0,0,.25),0 18px 36px rgba(0,0,0,.28),0 0 28px color-mix(in srgb,var(--tint) 45%,transparent);transition:transform .25s}
.pc:hover{transform:translateY(-4px)}
.pc1{order:2;padding-top:36px;padding-bottom:28px}.pc2{order:1}.pc3{order:3}
.rk{position:absolute;right:12px;top:-8px;font:700 6.5rem/1 "Archivo Narrow",sans-serif;opacity:.2}
.pcl{font-size:.85rem;opacity:.88}
.pn{font:700 1.5rem/1.1 "Archivo Narrow",sans-serif;text-transform:uppercase}
.pc1 .pn{font-size:1.95rem}
.pg{font:700 3rem/1 "Archivo Narrow",sans-serif;margin:8px 0 4px;text-shadow:0 0 20px rgba(255,255,255,.35)}
.pc1 .pg{font-size:4.4rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.sm{padding:14px;border-radius:20px;gap:10px;-webkit-tap-highlight-color:transparent}
.pc::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:45%;opacity:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 0,rgba(255,255,255,.18) 30%,rgba(255,255,255,.7) 50%,rgba(255,255,255,.18) 70%,rgba(255,255,255,0) 100%);transform:translateX(-160%) skewX(-18deg)}
.pc:hover::after,.pc:active::after,.pc:focus-visible::after{animation:sheen .85s cubic-bezier(.3,.6,.3,1) both}
.pc:hover,.pc:active{box-shadow:inset 0 1px 2px rgba(255,255,255,.9),inset 0 -8px 16px rgba(0,0,0,.2),0 18px 36px rgba(0,0,0,.3),0 0 38px color-mix(in srgb,var(--tint) 70%,transparent)}
.pc:active{transform:scale(.97)}
@keyframes sheen{0%{opacity:1;transform:translateX(-160%) skewX(-18deg)}100%{opacity:1;transform:translateX(330%) skewX(-18deg)}}
@media (prefers-reduced-motion:reduce){.pc:hover::after,.pc:active::after,.pc:focus-visible::after{animation:none;opacity:.25;transform:translateX(100%) skewX(-18deg)}}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nb{font:700 1.05rem "Archivo Narrow",sans-serif;min-width:38px;text-align:center;padding:3px 10px;border-radius:999px;color:#fff;border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.1));box-shadow:inset 0 1px 1px rgba(255,255,255,.8)}
.cb{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;min-width:0}
.ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm .dot{margin:0;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.sm .pn{font-size:1.2rem}
.gl{display:flex;align-items:baseline;gap:6px;padding-top:4px}
.sm .pg{font-size:2.1rem;margin:0}
.gl em{font-style:normal;font-size:.8rem;opacity:.8}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.podium{grid-template-columns:1fr;margin-top:-80px}.pc1{order:1}.pc2{order:2}.pc3{order:3}.hero div{padding-bottom:110px}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
.empty{padding:36px 0;color:var(--muted)}
.note{margin-top:22px;max-width:64ch;font-size:.82rem;color:var(--muted)}
dialog{--tint:#2f7d46;border:1px solid rgba(255,255,255,.5);border-radius:28px;color:#fff;padding:0;width:min(520px,calc(100% - 28px));max-height:calc(100% - 28px);overflow-y:auto;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--tint) 70%,#fff) 0,transparent 60%),linear-gradient(180deg,color-mix(in srgb,var(--tint) 40%,#07130c),#07130c 85%);box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 30px 80px rgba(0,0,0,.55),0 0 60px color-mix(in srgb,var(--tint) 50%,transparent)}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
dialog::before{content:"";position:absolute;inset:0;pointer-events:none;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:conic-gradient(from var(--ang,160deg) at 50% -10%,rgba(255,255,215,.36),rgba(255,255,215,0) 40deg);animation:sweep 6s ease-in-out infinite alternate}
dialog::backdrop{background:rgba(3,12,7,.72);backdrop-filter:blur(6px)}
@property --ang{syntax:"<angle>";inherits:false;initial-value:160deg}
@keyframes sweep{from{--ang:148deg}to{--ang:196deg}}
.fx{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.fx i{position:absolute;border-radius:50%;filter:blur(38px);mix-blend-mode:screen}
.fx i:nth-child(1){width:260px;height:260px;left:-60px;top:-40px;background:color-mix(in srgb,var(--tint) 85%,#fff);opacity:.55;animation:d1 9s ease-in-out infinite alternate}
.fx i:nth-child(2){width:220px;height:220px;right:-50px;top:150px;background:color-mix(in srgb,var(--tint) 60%,#ffe27a);opacity:.45;animation:d2 11s ease-in-out infinite alternate}
.fx i:nth-child(3){width:300px;height:300px;left:30%;bottom:-130px;background:var(--tint);opacity:.6;animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(170px,130px) scale(1.3)}}
@keyframes d2{to{transform:translate(-190px,-70px) scale(.8)}}
@keyframes d3{to{transform:translate(130px,-150px) scale(1.25)}}
.fx u{position:absolute;left:50%;top:40%;width:240px;height:240px;margin:-120px 0 0 -120px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;opacity:0;animation:ring 5s ease-out infinite}
.fx u:nth-of-type(2){animation-delay:2.5s}
@keyframes ring{from{transform:scale(.3);opacity:.7}to{transform:scale(2.6);opacity:0}}
.fx b{position:absolute;left:0;bottom:-20px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:50px 0 #fff,130px -40px #fff,220px 30px #fff,310px -20px #fff,400px 10px #fff,470px -60px #fff;animation:rise 8s linear infinite}
.fx b+b{left:24px;animation-duration:12s;animation-delay:-4s;box-shadow:90px 0 #fff,180px -50px #fff,270px 20px #fff,360px -30px #fff,440px 40px #fff}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.75}100%{transform:translateY(-660px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx i,.fx u,.fx b,dialog::before{animation:none}.fx u,.fx b{display:none}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.dh,.st,#dd{position:relative}
.drk{position:absolute;right:18px;top:-10px;font:700 10rem/1 "Archivo Narrow",sans-serif;opacity:.13;pointer-events:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 24px 8px}
.dc{display:inline-flex;align-items:center;font-size:.85rem;padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08)),color-mix(in srgb,var(--tint) 60%,transparent);box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}

dt{color:var(--muted)}dd{font-weight:500;text-align:right}
